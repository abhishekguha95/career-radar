name: career-radar
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_radar_local}
      POSTGRES_DB: ${POSTGRES_DB:-career_radar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g
volumes:
  postgres_data:
